name: Build fork packages

on:
  push:
    branches: [master, codex/fork-build]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0

jobs:
  build:
    if: github.repository == 'xuhuanhello/herdr-app'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x86_64, runner: windows-2022 }
          - { target: macos-aarch64, runner: macos-26 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache Cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: fork-build-v1-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            fork-build-v1-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-
            fork-build-v1-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      - name: Build and package
        env:
          HERDR_APP_FORK_BUILD: ${{ github.run_number }}
          HERDR_APP_FORK_RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases
        run: scripts/package --local
      - name: Test the updater on validation branches
        if: github.ref_name != github.event.repository.default_branch
        env:
          HERDR_TEST_TMPDIR: ${{ runner.temp }}
          HERDR_APP_HOME: ${{ runner.temp }}/herdr-updater-test
        run: cargo test --release --locked -p herdr-app --bin herdr-app -- update::tests update_notes::tests
      - name: Record sources for the next build
        run: scripts/ci-sources record
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-${{ matrix.target }}
          path: dist/herdr-app-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      github.repository == 'xuhuanhello/herdr-app'
      && github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: fork-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: herdr-app-*
          path: dist
          merge-multiple: true
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fork-release.py
